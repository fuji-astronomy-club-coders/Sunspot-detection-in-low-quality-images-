# 4観測所を必ず登録します。向きの指定方式は観測所ごとに fixed / per_sample を選べます。
# north_vector は向きのみ（+X右、+Y上）。north_angle_deg は度（0°=+X、反時計回り）です。天文学の位置角ではありません。flip_x は左右反転の真偽値です。
# 以下の方向値・表示名は入力例であり、実観測所の設定値ではありません。
sources:
  - source_id: source_01
    display_name: "観測所A（仮）"
    orientation_policy: fixed
    north_vector: {x: 0.0, y: 1.0}  # 向きのみ。+Y は北（上）
    flip_x: false  # 左右反転の有無（真偽値）

  - source_id: source_02
    display_name: "観測所B（仮）"
    orientation_policy: fixed
    north_angle_deg: 90.0  # 度。0°=+X（右）、反時計回りが正
    flip_x: false

  - source_id: source_03
    display_name: "観測所C（仮）"
    orientation_policy: fixed
    north_vector: {x: 0.0, y: 1.0}
    flip_x: false

  - source_id: source_04
    display_name: "観測所D（仮）"
    orientation_policy: per_sample
    # per_sample の場合は comparison.yaml に north_vector または north_angle_deg と flip_x を入力します。
