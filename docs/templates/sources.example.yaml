# 4観測所を固定で登録します。
# north_vector（+X右、+Y上）または north_angle_deg（0°右、反時計回り）で方向を指定します。flip_x と合わせて実画像で確認してください。
# 以下の方向値・表示名は入力例であり、実観測所の設定値ではありません。
sources:
  - source_id: source_01
    display_name: "観測所A（仮）"
    orientation_policy: fixed
    north_vector: {x: 0.0, y: 1.0}
    flip_x: false

  - source_id: source_02
    display_name: "観測所B（仮）"
    orientation_policy: fixed
    north_angle_deg: 90.0
    flip_x: false

  - source_id: source_03
    display_name: "観測所C（仮）"
    orientation_policy: fixed
    north_vector: {x: 0.0, y: 1.0}
    flip_x: false

  - source_id: source_04
    display_name: "観測所D（仮）"
    orientation_policy: per_sample
    # per_sample の場合は comparison.yaml に north_vector または north_angle_deg と flip_x を入力します。
