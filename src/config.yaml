# ============================================================
# Python Project Configuration
# File: config.yaml
# ============================================================
# 注意:
# - パスは原則としてプロジェクトルートからの相対パスにする
# - 秘密情報は記載せず、環境変数から読み込む
# - このファイルは YAML 形式で保存する（UTF-8）
# ============================================================

Paths: # 相対パスはプロジェクトルートを基準とする
  input_image: 'E:\astro\tenmon_samples\img00000002.tiff' # You can use "?Dialog?" to select a file interactively
  output_folder: '.\results'

# MIN2による太陽円推定
MIN2:
  n: 10 # 画像を縦横に分割する数（2以上）
  light_threshold: 50 # 太陽像とみなす輝度しきい値（16 bit画像では内部で256倍）
  limb_width: "1/30" # 太陽直径に対する割合。D=500pxでは従来の1/30（半径比）と同じ
  iter_cycles: 2 # 黒点を除外して円を再推定する最大反復回数（0で反復なし）
  show: false # 最終的なMIN2検出結果をMatplotlibで表示
  debug: false # MIN2の各反復の診断ログ・描画を有効化
  show_simple: false # show/debug時に簡易プロットを使用
  load_saved_result: true # 同じフォルダの <画像名>_min2.json を優先して再利用

#周縁減光補正
LimbDarkingResolution:
  chosen_method: "polynomialFit" # 'polynomialFit'のいずれかを選択
  # ---各methodのパラメータ---
  polynomialFit:
    alpha: 0.85
    brightness_boost: 1.1

#強調処理
Emphasis:
  chosen_method: "BlackTopHat" # 'SobelFilter', 'BlackTopHat', 'GaussianFilter'のいずれかを選択
  # ---各methodのパラメータ---
  SobelFilter:
    kernelSize: "3/500" # 太陽直径に対する割合（D=500pxで3px）
  BlackTopHat:
    kernelSize: "3/100" # 太陽直径に対する割合（D=500pxで15px）
  GaussianFilter:
    sigmaSize: "1/25" # 太陽直径に対する割合（D=500pxで20px）

#抽出処理
Extraction:
  chosen_method: "watershed" # 'countComponents', 'watershed'のいずれかを選択
  # ---各methodのパラメータ---
  countComponents: # ここのパラメータはwatershedと共用です
    c: 1
    space_threshold: 1000
    min_area: "1/125000" # 太陽直径の二乗に対する割合（D=500pxで2px²）
  watershed:
    min_distance: "1/100" # 太陽直径に対する割合（D=500pxで5px）

# 抽出した黒点の外接矩形・ラベル画像
BoundingBox:
  enabled: true # falseにすると外接矩形オーバーレイを出力しない
  save_png: true # PNG画像を保存
  save_svg: true # 背景画像を埋め込み、矩形・文字をベクター要素としてSVG保存
  background_mode: image # image: 選択した処理段階の画像 / transparent: 背景透過
  background_stage: emphasized # input / limb_corrected / emphasized / extraction / mask_applied
  box_color: [0, 255, 0] # 外接矩形の色（RGB）。既定は緑
  background_low_percentile: 1.0 # 背景画像の表示下限パーセンタイル
  background_high_percentile: 99.5 # 背景画像の表示上限パーセンタイル
  line_width: 1 # 外接矩形の線幅（px）
  label_color: [0, 200, 150] # ラベル文字色（RGB）
  label_outline_color: [0, 0, 0] # 文字の視認性を高める輪郭色（RGB）
  label_font_scale: 0.3 # OpenCV / SVG の文字サイズ係数
  label_thickness: 1 # 文字の線幅
  label_outline_thickness: 1 # 文字輪郭の追加線幅
  label_padding: 0 # ラベル配置領域の内側余白（px）
  label_gap: 5 # ラベルと黒点・他ラベルの間隔（px）
  collision_avoidance: true # 他ラベル・矩形との重なりを避けて番号を配置
  show_leader_lines: true # 移動したラベルと黒点を結ぶ線を表示
  leader_line_color: [0, 255, 100] # 引出線の色（RGB）

# 黒点のマスク除外設定
Mask:
  # overlap: 除外領域に1画素でも入った黒点を除外
  # centroid: 黒点の重心が除外領域内にある場合だけ除外
  # contained: 黒点の全画素が複数を含む除外領域の和集合内にあれば除外
  # Rmaskと通常の矩形maskの両方に適用
  boundary_policy: overlap
  Rmask:
    enabled: true # trueにするとMIN2の太陽中心・半径から外周側の黒点を除外
    radius_ratio: 0.85 # 太陽半径に対する除外境界の割合（正の有限値。1を超える値も指定可能）

# マスク選択ダイアログ
MaskDialog:
  enabled: false # falseにすると矩形マスク選択ダイアログを開かずに処理を続行
  display:
    # 表示用カラーマップ: GRAY, HOT, JET, VIRIDIS, INFERNO, PLASMA, TURBO など
    colormap: HOT
    show_coordinates: true
    show_instructions: true
    # true: リサイズ可能（ウィンドウの縦横比は固定） / false: 固定サイズ
    resizable: true
    # true: 画像に対する表示倍率を表示
    show_scale: true
    window_width: 1100
    window_height: 800
    rectangle_color: [0, 255, 0]
    rectangle_thickness: 2
# 実行後の結果画像プレビュー
Display:
  colormap: HOT # 最終確認画面の輝度表示カラーマップ
  show_final_image: false # trueにするとPyQtで最終解析画像を表示
  show_mask_fill: true # 最終確認画面で選択したマスク範囲を塗りつぶす
  show_invalid_sunspots: true # 最終確認画面でマスクにより除外された黒点を表示する
  show_rmask_fill: true # 最終確認画面でRmask境界円より外側を塗りつぶす
  show_solar_circle: false # 最終確認画面でMIN2の太陽近似円と中心を表示する
  mask_fill_color: [0, 255, 0] # 通常maskの塗りつぶし色（RGB）
  mask_fill_alpha: 72 # 通常maskの不透明度（0: 透明 ～ 255: 不透明）
  rmask_fill_color: [255, 165, 0] # Rmaskの塗りつぶし色（RGB）
  rmask_fill_alpha: 64 # Rmaskの不透明度（0: 透明 ～ 255: 不透明）
  solar_circle_color: [0, 220, 255] # 太陽近似円・中心マーカーの色（RGB）
  solar_circle_thickness: 2 # 太陽近似円の線幅

# 比較モード設定
Comparison:
  matching:
    tolerance_normalized: 0.025 # 太陽半径に対する比（秒角ではない）
  angular_radius_warning_arcsec:
    min: 900.0 # 秒角
    max: 1000.0 # 秒角
