# ============================================================
# Python Project Configuration
# File: config.yaml
# ============================================================
# 注意:
# - パスは原則としてプロジェクトルートからの相対パスにする
# - 秘密情報は記載せず、環境変数から読み込む
# - このファイルは YAML 形式で保存する（UTF-8）
# ============================================================

Paths: # 相対パスはプロジェクトルートを基準とする
  input_image: 'C:\Users\seigo\Downloads\2025-08-30-0437_9-CapObj - コピー\img00000968.tiff'
  output_folder: '.\results'
  folder_names: #output_folderに対する相対パス
    LimbDarkingResolution: LimbDarkResol
    Emphasis: Emphasis
    Extraction: Extract

#周縁減光補正
LimbDarkingResolution:
  chosen_method: 'polynomialFit' # 'polynomialFit'のいずれかを選択
  # ---各methodのパラメータ---
  polynomialFit:
    alpha: 0.85
    brightness_boost: 1.1

#強調処理
Emphasis:
  chosen_method: 'SobelFilter' # 'SobelFilter', 'BrackTopHat', 'GaussianFilter'のいずれかを選択
  # ---各methodのパラメータ---
  SobelFilter:
    kernelSize:3
  BrackTopHat:
    kernelSize:15
  GaussianFilter:
    sigmaSize:20

#抽出処理
Extraction:
  chosen_method: 'countComponents' # 'countComponents'のいずれかを選択
  # ---各methodのパラメータ---
  countComponents:
    c: 1
    space_threshold: 1000

